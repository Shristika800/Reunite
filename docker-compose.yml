services:
  postgres:
    image: postgres:16
    container_name: reunite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reunite
      POSTGRES_PASSWORD: reunite
      POSTGRES_DB: reunite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: